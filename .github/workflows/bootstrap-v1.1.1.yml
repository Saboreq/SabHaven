name: Finalize v1.1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v1.1.1.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Validate and attach release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out v1.1.1
        uses: actions/checkout@v7
        with:
          ref: v1.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build production bundle
        run: npm run build

      - name: Package self-hosted bundle
        shell: bash
        run: |
          archive="sabhaven-v1.1.1.tar.gz"
          tar -czf "$archive" dist README.md LICENSE .env.example vercel.json
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.1 "$ARCHIVE" --clobber
