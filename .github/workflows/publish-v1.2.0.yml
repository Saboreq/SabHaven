name: Publish v1.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.0.yml

permissions:
  contents: write

jobs:
  publish:
    name: Validate package and publish v1.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ea139e69db83a7e2cd7a72020275fca61b48748d

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Package self-hosted bundle
        shell: bash
        run: |
          archive="sabhaven-v1.2.0.tar.gz"
          tar -czf "$archive" dist README.md LICENSE PRIVACY.md TERMS.md ACCEPTABLE_USE.md .env.example vercel.json
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          SabHaven v1.2.0 adds the hosted-service legal, privacy, account-control, and error-state framework.

          ## Added
          - Privacy Policy, Terms of Service, Acceptable Use, abuse-reporting, security, and contact pages.
          - Versioned Terms acceptance during invite-only registration with server-timestamped acceptance records.
          - Signed-in account-data export and automated account deletion for eligible non-owner accounts.
          - Custom 403, 404, 410, and application-error screens.
          - RFC 9116-style security.txt contact metadata.
          - Repository copies of Privacy, Terms, and Acceptable Use policies.

          ## Security and privacy
          - Account deletion removes owned Storage objects before deleting the Auth account.
          - Automated deletion cannot remove the single owner account.
          - Account tools require authenticated user JWTs and independently resolve the caller.
          - Members can read only their own invite-redemption history.
          - Hosted responses include CSP, HSTS, frame denial, MIME-sniffing protection, referrer policy, and restrictive browser permissions.
          - Registration distinguishes contractual Terms acceptance from acknowledgement of the Privacy Policy.

          ## Self-hosting
          Self-hosters should deploy the new migrations and account-tools Edge Function and replace the hosted-service legal documents with policies appropriate to their own deployment.

          See CHANGELOG.md for the full change summary.
          EOF

      - name: Publish release and bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v1.2.0 >/dev/null 2>&1; then
            gh release create v1.2.0 \
              --target ea139e69db83a7e2cd7a72020275fca61b48748d \
              --title "SabHaven v1.2.0 — Legal, privacy and account controls" \
              --notes-file /tmp/release-notes.md
          fi
          gh release upload v1.2.0 "$ARCHIVE" --clobber
