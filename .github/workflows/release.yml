name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build production bundle
        run: npm run build

      - name: Package self-hosted bundle
        shell: bash
        run: |
          archive="sabhaven-${{ github.event.release.tag_name }}.tar.gz"
          tar -czf "$archive" dist README.md LICENSE .env.example vercel.json
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Attach bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ARCHIVE" --clobber
