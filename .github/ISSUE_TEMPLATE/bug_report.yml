name: Bug report
description: Report a reproducible SabHaven problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately using the instructions in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Sign in as...
        2. Open...
        3. Select...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 153.0.1

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Remove access tokens, cookies, personal data, and secrets before pasting logs.
      render: shell
